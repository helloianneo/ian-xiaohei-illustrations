<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Triceratops: Three-horned herbivore with defensive nature -->
  <defs>
    <style>
      .dino-outline { stroke: #000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dino-body { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
      .dino-fill { stroke: #000; stroke-width: 1.5; fill: #f5f5f0; }
    </style>
  </defs>
  
  <g>
    <!-- Tail -->
    <path d="M 55 130 Q 40 135 30 155" class="dino-body" stroke-width="2"/>
    
    <!-- Back legs (sturdy) -->
    <ellipse cx="70" cy="165" rx="13" ry="32" class="dino-body"/>
    <ellipse cx="110" cy="165" rx="13" ry="32" class="dino-body"/>
    
    <!-- Feet -->
    <ellipse cx="68" cy="205" rx="11" ry="9" class="dino-body"/>
    <ellipse cx="112" cy="205" rx="11" ry="9" class="dino-body"/>
    
    <!-- Front legs (shorter, more defensive stance) -->
    <ellipse cx="80" cy="155" rx="12" ry="30" class="dino-body"/>
    <ellipse cx="125" cy="155" rx="12" ry="30" class="dino-body"/>
    
    <!-- Front feet -->
    <ellipse cx="78" cy="192" rx="10" ry="8" class="dino-body"/>
    <ellipse cx="127" cy="192" rx="10" ry="8" class="dino-body"/>
    
    <!-- Body (bulky, herbivore) -->
    <ellipse cx="90" cy="110" rx="48" ry="42" class="dino-body"/>
    
    <!-- Body texture -->
    <path d="M 60 100 Q 65 90 75 95" class="dino-outline" stroke-width="1"/>
    
    <!-- Neck (thick) -->
    <path d="M 125 95 Q 145 80 155 50" class="dino-body" stroke-width="2.5"/>
    
    <!-- Head (blocky) -->
    <rect x="145" y="35" width="32" height="26" rx="4" class="dino-body"/>
    
    <!-- Snout/face area -->
    <ellipse cx="163" cy="60" rx="12" ry="10" class="dino-fill"/>
    
    <!-- Large defensive frill (curved back) -->
    <path d="M 155 48 Q 165 35 175 38 Q 182 42 180 55 Q 175 62 160 60" class="dino-body" stroke-width="2.2"/>
    <path d="M 158 48 Q 168 30 178 35" class="dino-outline" stroke-width="1.8"/>
    
    <!-- Frill details/ridges -->
    <line x1="160" y1="45" x2="162" y2="28" class="dino-outline" stroke-width="1.2"/>
    <line x1="168" y1="37" x2="172" y2="20" class="dino-outline" stroke-width="1.2"/>
    <line x1="176" y1="42" x2="180" y2="28" class="dino-outline" stroke-width="1.2"/>
    
    <!-- Three horns (distinctive feature) -->
    <!-- Top horn (largest) -->
    <line x1="157" y1="38" x2="152" y2="10" class="dino-outline" stroke-width="2.5"/>
    <path d="M 155 37 Q 150 25 149 10" class="dino-outline" stroke-width="2"/>
    
    <!-- Left horn -->
    <line x1="165" y1="58" x2="175" y2="78" class="dino-outline" stroke-width="2"/>
    <path d="M 163 57 Q 172 68 178 80" class="dino-outline" stroke-width="1.8"/>
    
    <!-- Right horn -->
    <line x1="173" y1="58" x2="188" y2="72" class="dino-outline" stroke-width="2"/>
    <path d="M 171 57 Q 185 68 193 75" class="dino-outline" stroke-width="1.8"/>
    
    <!-- Eye -->
    <circle cx="158" cy="48" r="2" fill="#000"/>
    
    <!-- Nostril -->
    <circle cx="168" cy="58" r="1.2" fill="#000"/>
    
    <!-- Mouth line -->
    <line x1="170" y1="62" x2="178" y2="65" class="dino-outline" stroke-width="1.2"/>
    
    <!-- Back spikes/ridges along spine -->
    <line x1="65" y1="80" x2="60" y2="55" class="dino-outline" stroke-width="1.8"/>
    <line x1="80" y1="75" x2="80" y2="48" class="dino-outline" stroke-width="2"/>
    <line x1="95" y1="72" x2="98" y2="42" class="dino-outline" stroke-width="2"/>
    <line x1="110" y1="75" x2="115" y2="50" class="dino-outline" stroke-width="1.8"/>
  </g>
</svg>