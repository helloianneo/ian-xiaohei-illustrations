<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Pteranodon: Flying reptile with large crest and wings -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body (small) -->
    <ellipse cx="80" cy="120" rx="20" ry="18"/>
    <!-- Head -->
    <circle cx="95" cy="100" r="12"/>
    <!-- Large crest (distinctive feature) -->
    <path d="M 100 90 Q 115 80 125 75 Q 120 85 110 95" stroke-width="2.5"/>
    <!-- Crest outline -->
    <path d="M 100 88 Q 120 78 128 72"/>
    <!-- Eye -->
    <circle cx="98" cy="98" r="1.5" fill="#000"/>
    <!-- Mouth/beak -->
    <line x1="105" y1="100" x2="115" y2="98"/>
    <!-- Left wing (membrane) -->
    <path d="M 80 115 Q 40 100 30 80 Q 35 90 50 105"/>
    <path d="M 78 118 Q 50 110 40 95"/>
    <!-- Right wing (membrane) -->
    <path d="M 80 115 Q 120 100 130 80 Q 125 90 110 105"/>
    <path d="M 82 118 Q 110 110 120 95"/>
    <!-- Tail (stabilizer) -->
    <path d="M 70 130 Q 50 140 40 155"/>
    <!-- Back legs (small) -->
    <path d="M 75 135 L 73 155"/>
    <path d="M 85 135 L 87 155"/>
    <!-- Claws on legs -->
    <line x1="73" y1="155" x2="70" y2="162"/>
    <line x1="87" y1="155" x2="90" y2="162"/>
    <!-- Wing detail lines -->
    <line x1="75" y1="120" x2="50" y2="105"/>
    <line x1="85" y1="120" x2="110" y2="105"/>
  </g>
</svg>