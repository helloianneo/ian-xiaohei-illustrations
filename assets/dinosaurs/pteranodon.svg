<svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <defs>
    <style>
      .body { stroke: #000; stroke-width: 1.8; fill: #f5f5f0; }
      .wing { stroke: #000; stroke-width: 1.5; fill: #f5f5f0; }
      .crest { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
    </style>
  </defs>
  
  <g>
    <!-- Body (small) -->
    <ellipse cx="85" cy="120" rx="20" ry="18" class="body"/>
    
    <!-- Head -->
    <circle cx="105" cy="95" r="12" class="body"/>
    
    <!-- Snout (pointed) -->
    <polygon points="115,92 128,90 122,100" class="body"/>
    
    <!-- Crest (backward curved) -->
    <path d="M 108 82 Q 125 68 140 65 Q 142 72 128 80 Q 112 85 108 84" fill="#f5f5f0" stroke="#000" stroke-width="2"/>
    
    <!-- Crest detail -->
    <path d="M 110 82 Q 128 70 138 66" fill="none" stroke="#000" stroke-width="1.2"/>
    
    <!-- Eye -->
    <circle cx="110" cy="90" r="1.6" fill="#000"/>
    
    <!-- Left wing (main feature) -->
    <ellipse cx="50" cy="115" rx="35" ry="22" class="wing"/>
    
    <!-- Left wing internal structure -->
    <ellipse cx="50" cy="115" rx="30" ry="18" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Right wing -->
    <ellipse cx="120" cy="115" rx="35" ry="22" class="wing"/>
    
    <!-- Right wing internal structure -->
    <ellipse cx="120" cy="115" rx="30" ry="18" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Tail (rudder) -->
    <path d="M 75 130 Q 60 150 50 170" fill="none" stroke="#000" stroke-width="1.8"/>
    <ellipse cx="48" cy="172" rx="6" ry="5" class="body"/>
    
    <!-- Hind leg left -->
    <ellipse cx="80" cy="140" rx="6" ry="18" class="body"/>
    
    <!-- Hind leg right -->
    <ellipse cx="90" cy="140" rx="6" ry="18" class="body"/>
    
    <!-- Hind foot left -->
    <ellipse cx="79" cy="162" rx="5" ry="4" class="body"/>
    
    <!-- Hind foot right -->
    <ellipse cx="91" cy="162" rx="5" ry="4" class="body"/>
  </g>
</svg>