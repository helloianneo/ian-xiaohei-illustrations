<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <defs>
    <style>
      .body { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
      .limb { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
    </style>
  </defs>
  
  <g>
    <!-- Tail -->
    <ellipse cx="50" cy="120" rx="25" ry="12" class="body"/>
    
    <!-- Body -->
    <ellipse cx="100" cy="110" rx="45" ry="35" class="body"/>
    
    <!-- Neck -->
    <rect x="130" y="85" width="20" height="35" rx="10" class="body"/>
    
    <!-- Head -->
    <ellipse cx="155" cy="65" rx="16" ry="18" class="body"/>
    
    <!-- Lower jaw -->
    <rect x="155" y="80" width="18" height="8" rx="4" class="body"/>
    
    <!-- Eye -->
    <circle cx="160" cy="60" r="2.5" fill="#000"/>
    
    <!-- Back leg left -->
    <ellipse cx="80" cy="160" rx="12" ry="32" class="limb"/>
    
    <!-- Back leg right -->
    <ellipse cx="110" cy="160" rx="12" ry="32" class="limb"/>
    
    <!-- Back foot left -->
    <ellipse cx="78" cy="200" rx="10" ry="8" class="body"/>
    
    <!-- Back foot right -->
    <ellipse cx="112" cy="200" rx="10" ry="8" class="body"/>
    
    <!-- Front arm left -->
    <rect x="105" y="115" width="10" height="20" rx="5" class="limb"/>
    
    <!-- Front arm right -->
    <rect x="120" y="120" width="10" height="18" rx="5" class="limb"/>
    
    <!-- Spike 1 -->
    <polygon points="70,75 65,50 75,50" class="body"/>
    
    <!-- Spike 2 -->
    <polygon points="90,68 85,40 95,40" class="body"/>
    
    <!-- Spike 3 -->
    <polygon points="110,65 105,35 115,35" class="body"/>
    
    <!-- Spike 4 -->
    <polygon points="130,68 128,42 138,40" class="body"/>
  </g>
</svg>