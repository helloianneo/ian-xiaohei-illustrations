<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Stegosaurus: Plated dinosaur with back plates and tail spikes -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="100" cy="105" rx="48" ry="35"/>
    <!-- Neck -->
    <path d="M 140 95 L 160 80"/>
    <!-- Head -->
    <circle cx="170" cy="70" r="15"/>
    <!-- Eye -->
    <circle cx="175" cy="68" r="2" fill="#000"/>
    <!-- Mouth -->
    <path d="M 175 75 L 180 78"/>
    <!-- Back plates (distinctive feature) -->
    <path d="M 70 65 L 65 35" stroke-width="3"/>
    <path d="M 85 55 L 80 25" stroke-width="3"/>
    <path d="M 100 50 L 100 15" stroke-width="3"/>
    <path d="M 115 55 L 120 25" stroke-width="3"/>
    <path d="M 130 65 L 135 35" stroke-width="3"/>
    <!-- Tail with spikes -->
    <path d="M 52 110 Q 35 115 25 130"/>
    <!-- Tail spikes -->
    <line x1="30" y1="128" x2="25" y2="140"/>
    <line x1="28" y1="131" x2="20" y2="145"/>
    <line x1="26" y1="133" x2="15" y2="148"/>
    <!-- Back legs -->
    <path d="M 85 138 L 82 172"/>
    <path d="M 115 138 L 118 172"/>
    <!-- Front legs -->
    <path d="M 95 138 L 92 165"/>
    <path d="M 105 138 L 108 165"/>
  </g>
</svg>