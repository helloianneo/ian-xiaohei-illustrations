<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <defs>
    <style>
      .body { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
      .limb { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
    </style>
  </defs>
  
  <g>
    <!-- Tail -->
    <path d="M 60 110 Q 40 105 15 125" fill="none" stroke="#000" stroke-width="2.2"/>
    <ellipse cx="12" cy="128" rx="6" ry="5" class="body"/>
    
    <!-- Back legs (shorter) -->
    <ellipse cx="55" cy="165" rx="15" ry="35" class="limb"/>
    <ellipse cx="90" cy="165" rx="15" ry="35" class="limb"/>
    
    <!-- Back feet -->
    <ellipse cx="52" cy="208" rx="12" ry="9" class="body"/>
    <ellipse cx="93" cy="208" rx="12" ry="9" class="body"/>
    
    <!-- Body -->
    <ellipse cx="85" cy="105" rx="50" ry="45" class="body"/>
    
    <!-- Front legs (much longer - distinctive) -->
    <ellipse cx="135" cy="140" rx="18" ry="50" class="limb"/>
    <ellipse cx="175" cy="140" rx="18" ry="50" class="limb"/>
    
    <!-- Front feet -->
    <ellipse cx="133" cy="200" rx="14" ry="11" class="body"/>
    <ellipse cx="177" cy="200" rx="14" ry="11" class="body"/>
    
    <!-- Neck (very long) -->
    <rect x="130" y="55" width="22" height="60" rx="11" class="limb"/>
    
    <!-- Head -->
    <circle cx="160" cy="45" r="13" class="body"/>
    
    <!-- Small head details -->
    <ellipse cx="170" cy="42" rx="6" ry="5" class="body"/>
    
    <!-- Eye -->
    <circle cx="165" cy="38" r="1.8" fill="#000"/>
    
    <!-- Nostril -->
    <circle cx="174" cy="42" r="1" fill="#000"/>
    
    <!-- Back spikes -->
    <polygon points="60,70 55,48 65,52" class="body"/>
    <polygon points="85,60 82,32 88,40" class="body"/>
    <polygon points="110,62 110,32 118,42" class="body"/>
  </g>
</svg>