<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Brachiosaurus: Giant sauropod with long neck and front legs longer than back legs -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back legs (shorter) -->
    <path d="M 85 140 L 80 175"/>
    <path d="M 105 140 L 110 175"/>
    <!-- Body -->
    <ellipse cx="100" cy="110" rx="40" ry="35"/>
    <!-- Front legs (much longer) -->
    <path d="M 125 120 L 130 180"/>
    <path d="M 135 120 L 140 180"/>
    <!-- Long neck (distinctive feature) -->
    <path d="M 130 80 Q 145 50 155 20"/>
    <!-- Head -->
    <circle cx="158" cy="12" r="8"/>
    <!-- Eye -->
    <circle cx="160" cy="10" r="1.5" fill="#000"/>
    <!-- Mouth -->
    <path d="M 162 12 L 168 12"/>
    <!-- Tail (balancing) -->
    <path d="M 60 110 Q 40 105 25 120"/>
    <!-- Tail end curve -->
    <path d="M 25 120 Q 20 130 30 135"/>
    <!-- Body spikes -->
    <line x1="80" y1="80" x2="75" y2="60"/>
    <line x1="100" y1="75" x2="100" y2="50"/>
    <line x1="120" y1="80" x2="125" y2="60"/>
  </g>
</svg>