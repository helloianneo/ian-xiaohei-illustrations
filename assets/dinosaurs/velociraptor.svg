<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Velociraptor: Small agile hunter with sharp claws -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="90" cy="105" rx="35" ry="28"/>
    <!-- Neck -->
    <path d="M 115 100 L 135 85"/>
    <!-- Head -->
    <circle cx="145" cy="75" r="12"/>
    <!-- Snout -->
    <path d="M 155 75 L 165 73"/>
    <!-- Eye -->
    <circle cx="148" cy="72" r="1.5" fill="#000"/>
    <!-- Teeth -->
    <line x1="160" y1="72" x2="163" y2="70"/>
    <line x1="160" y1="78" x2="163" y2="80"/>
    <!-- Tail (long and curved) -->
    <path d="M 55 110 Q 35 110 20 125 Q 15 135 20 140"/>
    <!-- Back leg (powerful) -->
    <path d="M 85 130 L 80 165"/>
    <!-- Large claw on back leg -->
    <path d="M 80 165 L 75 172"/>
    <path d="M 80 165 L 82 173"/>
    <!-- Front leg (smaller) -->
    <path d="M 100 125 L 105 150"/>
    <!-- Claws on front leg -->
    <line x1="105" y1="150" x2="103" y2="158"/>
    <line x1="105" y1="150" x2="107" y2="158"/>
    <!-- Back spikes/feathers -->
    <line x1="70" y1="80" x2="65" y2="60"/>
    <line x1="85" y1="75" x2="85" y2="50"/>
    <line x1="100" y1="80" x2="105" y2="55"/>
  </g>
</svg>