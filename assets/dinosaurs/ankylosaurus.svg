<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <defs>
    <style>
      .body { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
      .armor { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
    </style>
  </defs>
  
  <g>
    <!-- Tail -->
    <path d="M 50 120 Q 32 125 12 145" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Tail club -->
    <circle cx="8" cy="148" r="9" class="armor"/>
    
    <!-- Body -->
    <ellipse cx="95" cy="115" rx="48" ry="40" class="body"/>
    
    <!-- Neck -->
    <rect x="128" y="100" width="20" height="32" rx="10" class="body"/>
    
    <!-- Head -->
    <ellipse cx="160" cy="75" rx="13" ry="14" class="body"/>
    
    <!-- Beak -->
    <ellipse cx="170" cy="78" rx="6" ry="5" class="body"/>
    
    <!-- Eye -->
    <circle cx="163" cy="70" r="1.6" fill="#000"/>
    
    <!-- Back legs -->
    <ellipse cx="75" cy="170" rx="13" ry="32" class="body"/>
    <ellipse cx="110" cy="170" rx="13" ry="32" class="body"/>
    
    <!-- Back feet -->
    <ellipse cx="73" cy="210" rx="11" ry="8" class="body"/>
    <ellipse cx="112" cy="210" rx="11" ry="8" class="body"/>
    
    <!-- Front legs -->
    <ellipse cx="75" cy="160" rx="11" ry="28" class="body"/>
    <ellipse cx="115" cy="160" rx="11" ry="28" class="body"/>
    
    <!-- Front feet -->
    <ellipse cx="73" cy="193" rx="9" ry="7" class="body"/>
    <ellipse cx="117" cy="193" rx="9" ry="7" class="body"/>
    
    <!-- Armor plates on back (6 circular plates) -->
    <circle cx="70" cy="80" r="7" class="armor"/>
    <circle cx="82" cy="72" r="8" class="armor"/>
    <circle cx="97" cy="68" r="9" class="armor"/>
    <circle cx="112" cy="72" r="8" class="armor"/>
    <circle cx="124" cy="80" r="7" class="armor"/>
    
    <!-- Armor plate details -->
    <circle cx="70" cy="80" r="4" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="82" cy="72" r="5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="97" cy="68" r="6" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="112" cy="72" r="5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="124" cy="80" r="4" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Side spikes -->
    <polygon points="65,125 48,135 55,128" class="armor"/>
    <polygon points="125,128 142,138 135,130" class="armor"/>
  </g>
</svg>