<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Ankylosaurus: Armored dinosaur with bony plates and spikes -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Armored body -->
    <ellipse cx="100" cy="105" rx="50" ry="32"/>
    <!-- Armor plates on back -->
    <rect x="75" y="70" width="8" height="12" rx="2"/>
    <rect x="88" y="65" width="8" height="14" rx="2"/>
    <rect x="101" y="63" width="8" height="15" rx="2"/>
    <rect x="114" y="65" width="8" height="14" rx="2"/>
    <rect x="127" y="70" width="8" height="12" rx="2"/>
    <!-- Head -->
    <ellipse cx="145" cy="95" rx="18" ry="16"/>
    <!-- Eye -->
    <circle cx="150" cy="92" r="1.5" fill="#000"/>
    <!-- Beak-like mouth -->
    <path d="M 155 95 L 162 93"/>
    <!-- Spikes on head -->
    <line x1="150" y1="80" x2="148" y2="65"/>
    <line x1="158" y1="80" x2="162" y2="62"/>
    <!-- Back legs (short and sturdy) -->
    <path d="M 85 135 L 82 170"/>
    <path d="M 115 135 L 118 170"/>
    <!-- Front legs (short and sturdy) -->
    <path d="M 95 135 L 93 165"/>
    <path d="M 105 135 L 107 165"/>
    <!-- Tail with club -->
    <path d="M 50 105 Q 30 110 15 120"/>
    <!-- Tail club (bony weapon) -->
    <circle cx="12" cy="123" r="6"/>
    <!-- Club spikes -->
    <line x1="10" y1="118" x2="8" y2="110"/>
    <line x1="15" y1="117" x2="18" y2="108"/>
    <line x1="15" y1="129" x2="18" y2="138"/>
  </g>
</svg>