<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Parasaurolophus: Hadrosaur with distinctive curved crest -->
  <defs>
    <style>
      .dino-outline { stroke: #000; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dino-body { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
      .crest { stroke: #000; stroke-width: 2; fill: #f5f5f0; }
    </style>
  </defs>
  
  <g>
    <!-- Tail (long for balance) -->
    <path d="M 50 125 Q 30 120 15 140 Q 8 155 15 165" class="dino-body" stroke-width="2.2"/>
    
    <!-- Back legs (powerful) -->
    <ellipse cx="70" cy="165" rx="13" ry="35" class="dino-body"/>
    <ellipse cx="105" cy="165" rx="13" ry="35" class="dino-body"/>
    
    <!-- Back feet -->
    <ellipse cx="68" cy="208" rx="11" ry="9" class="dino-body"/>
    <ellipse cx="107" cy="208" rx="11" ry="9" class="dino-body"/>
    
    <!-- Front legs (hadrosaur - can walk on two or four) -->
    <ellipse cx="82" cy="150" rx="11" ry="32" class="dino-body"/>
    <ellipse cx="115" cy="150" rx="11" ry="32" class="dino-body"/>
    
    <!-- Front feet -->
    <ellipse cx="80" cy="188" rx="9" ry="8" class="dino-body"/>
    <ellipse cx="117" cy="188" rx="9" ry="8" class="dino-body"/>
    
    <!-- Body (rounded, herbivore) -->
    <ellipse cx="90" cy="110" rx="48" ry="40" class="dino-body"/>
    
    <!-- Chest detail -->
    <path d="M 60 100 Q 65 90 75 95" class="dino-outline" stroke-width="1"/>
    
    <!-- Neck (angled) -->
    <path d="M 130 100 Q 150 80 160 50" class="dino-body" stroke-width="2.2"/>
    
    <!-- Head (blocky, hadrosaur typical) -->
    <ellipse cx="167" cy="42" rx="14" ry="16" class="dino-body"/>
    
    <!-- Snout (flat for herbivore) -->
    <ellipse cx="175" cy="50" rx="10" ry="7" class="dino-body"/>
    
    <!-- Eye -->
    <circle cx="170" cy="36" r="1.8" fill="#000"/>
    
    <!-- Nostril -->
    <circle cx="182" cy="48" r="1" fill="#000"/>
    
    <!-- DISTINCTIVE CURVED CREST (main feature) -->
    <!-- Crest main structure (tubular, curved) -->
    <path d="M 164 32 Q 175 20 188 18 Q 195 18 198 28 Q 195 35 185 38 Q 175 40 165 35" class="crest" stroke-width="2.2"/>
    
    <!-- Crest curve interior -->
    <path d="M 166 33 Q 176 22 187 20" class="dino-outline" stroke-width="1.5"/>
    
    <!-- Crest ridges/details -->
    <line x1="170" y1="29" x2="173" y2="18" class="dino-outline" stroke-width="1"/>
    <line x1="178" y1="24" x2="182" y2="12" class="dino-outline" stroke-width="1"/>
    <line x1="187" y1="23" x2="192" y2="15" class="dino-outline" stroke-width="1"/>
    
    <!-- Back spikes/ridge -->
    <line x1="65" y1="80" x2="62" y2="55" class="dino-outline" stroke-width="1.5"/>
    <line x1="80" y1="75" x2="80" y2="48" class="dino-outline" stroke-width="1.8"/>
    <line x1="95" y1="72" x2="98" y2="45" class="dino-outline" stroke-width="1.8"/>
    <line x1="110" y1="75" x2="115" y2="52" class="dino-outline" stroke-width="1.5"/>
    
    <!-- Muscle definition on body -->
    <path d="M 70 105 Q 75 95 85 100" class="dino-outline" stroke-width="1"/>
  </g>
</svg>