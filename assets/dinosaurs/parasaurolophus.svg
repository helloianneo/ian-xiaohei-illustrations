<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f5f5f0;">
  <!-- Parasaurolophus: Hadrosaur with distinctive curved crest on head -->
  <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="95" cy="105" rx="42" ry="35"/>
    <!-- Neck -->
    <path d="M 130 95 L 150 75"/>
    <!-- Head -->
    <ellipse cx="160" cy="65" rx="16" ry="14"/>
    <!-- Distinctive curved crest (main feature) -->
    <path d="M 162 50 Q 172 45 180 50 Q 185 55 182 65" stroke-width="2.5"/>
    <!-- Crest details -->
    <path d="M 165 48 Q 172 42 178 48"/>
    <!-- Eye -->
    <circle cx="163" cy="62" r="1.5" fill="#000"/>
    <!-- Mouth line -->
    <line x1="165" y1="72" x2="172" y2="75"/>
    <!-- Back legs -->
    <path d="M 80 138 L 75 172"/>
    <path d="M 110 138 L 115 172"/>
    <!-- Front legs (hadrosaur typical) -->
    <path d="M 90 135 L 88 162"/>
    <path d="M 100 135 L 102 162"/>
    <!-- Tail (long) -->
    <path d="M 53 105 Q 35 105 20 120 Q 15 128 20 135"/>
    <!-- Body ridge -->
    <line x1="80" y1="75" x2="75" y2="55"/>
    <line x1="95" y1="70" x2="95" y2="48"/>
    <line x1="110" y1="75" x2="115" y2="55"/>
  </g>
</svg>