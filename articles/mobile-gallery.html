<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小黑配图手机预览</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f4ef;
      color: #171717;
    }

    body {
      margin: 0;
      padding: 20px;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      color: #555;
      line-height: 1.6;
      font-size: 15px;
    }

    figure {
      margin: 0 0 22px;
      background: #fff;
      border: 1px solid #e5e0d7;
      border-radius: 8px;
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    figcaption {
      padding: 10px 12px 12px;
      font-size: 14px;
      line-height: 1.4;
      color: #333;
    }
  </style>
</head>
<body>
  <main>
    <h1>小黑怪诞正文配图预览</h1>
    <p>手机和电脑连接同一个 Wi-Fi 后，用浏览器打开本地服务地址即可查看这 5 张图。</p>

    <figure>
      <img src="../assets/ian-xiaohei-illustrations-guide-illustrations/01-cognitive-translator.png" alt="认知翻译器">
      <figcaption>01 认知翻译器：文章到正文配图</figcaption>
    </figure>

    <figure>
      <img src="../assets/ian-xiaohei-illustrations-guide-illustrations/02-install-and-trigger.png" alt="安装和触发">
      <figcaption>02 安装和触发：复制 skill 目录并使用 Use 指令</figcaption>
    </figure>

    <figure>
      <img src="../assets/ian-xiaohei-illustrations-guide-illustrations/03-shot-list-anchors.png" alt="shot list 认知锚点">
      <figcaption>03 Shot list：只挑值得画的认知锚点</figcaption>
    </figure>

    <figure>
      <img src="../assets/ian-xiaohei-illustrations-guide-illustrations/04-boundaries-gate.png" alt="功能边界">
      <figcaption>04 功能边界：适合正文配图，不适合万能设计</figcaption>
    </figure>

    <figure>
      <img src="../assets/ian-xiaohei-illustrations-guide-illustrations/05-workflow-and-qa.png" alt="完整流程">
      <figcaption>05 完整流程：输入、锚点、生成、检查、保存</figcaption>
    </figure>
  </main>
</body>
</html>
